# Local stack for APP_ENV=local (plan §11). Every Makefile target drives this
# file: `make bootstrap` brings up the data plane, `make start` builds and runs
# everything, `make clean` tears it down with its volumes.
#
# The container services do NOT reuse config/profiles/local.env's URLs as-is:
# that profile is written for a process running on the HOST, where postgres,
# minio and mlflow are all on localhost. Inside the network they are reachable
# by service name instead, so each service overrides exactly those three
# endpoints and nothing else. Both views of the same stack stay valid, which is
# what lets `uv run maxxflow ...` on the host and the API in a container talk to
# one database.
#
# Not included: a `frontend` service. The Vite SPA is not part of this
# checkout, and services/configurator/app.py already serves a JSON stub at /
# when frontend/dist is absent, so the API runs without it.

name: maxxflow

x-app-env: &app-env
  APP_ENV: local
  # Service names, not localhost — see the note above.
  DATA_DB_URL: postgresql+psycopg://maxxflow:maxxflow@postgres:5432/maxxflow
  DATA_DB_IS_REPLICA: "false"
  LAKE_URI: s3://maxxflow-lake
  LAKE_KEY: minioadmin
  LAKE_SECRET: minioadmin
  LAKE_ENDPOINT_URL: http://minio:9000
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_REGISTRY_URI: http://mlflow:5000
  MODEL_ALIAS: champion
  # Deterministic stubs by default — no paid API from a local container.
  # Point M3's judge at a real model by setting these in .env.local:
  #   LLM_PROVIDER=azure_ai
  #   AZURE_AI_API_KEY=... / AZURE_AI_API_BASE=... / LLM_MODEL_ID=<deployment>
  LLM_PROVIDER: ${LLM_PROVIDER:-stub}
  EMBEDDING_PROVIDER: stub
  EMBEDDINGS_ENABLED: "false"
  LLM_MODEL_ID: ${LLM_MODEL_ID:-}
  AZURE_AI_API_KEY: ${AZURE_AI_API_KEY:-}
  AZURE_AI_API_BASE: ${AZURE_AI_API_BASE:-}
  HMAC_SALT: local-dev-salt-change-me
  # Every /api/* route is authenticated (services/configurator/security.py).
  # Locally the HS256 path is the usable one: mint a matching token with
  # `python scripts/dev_auth.py`, which also seeds the identity rows the
  # verifier reads. A real deployment sets JWT_AUTHORITY/JWT_JWKS_URI instead
  # and leaves this unset.
  JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-32b}
  DEFAULT_TENANT: demo
  TENANT_SCHEMA_PREFIX: tenant_
  PRESENTATION_TZ: Australia/Sydney
  MODEL_LRU_SIZE: "8"

x-build: &app-build
  context: .
  dockerfile: docker/Dockerfile

services:
  # --- data plane ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maxxflow
      POSTGRES_PASSWORD: maxxflow
      POSTGRES_DB: maxxflow
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      # -d as well as -U: without the database name pg_isready reports ready
      # while the initdb bootstrap is still running its own server.
      test: ["CMD-SHELL", "pg_isready -U maxxflow -d maxxflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # Host ports are overridable because 9000/9001 are MinIO's defaults and so
    # are the first thing another local stack takes. Only the host side moves —
    # in-network traffic still goes to minio:9000, so nothing else changes.
    ports:
      - "${MINIO_API_PORT:-9010}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9011}:9001"   # console
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the medallion bucket once and exits. `--wait` treats a container
  # that exits 0 as healthy, so bootstrap can depend on its completion.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/maxxflow-lake &&
      echo 'bucket maxxflow-lake ready'
      "
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports: ["${MLFLOW_PORT:-8085}:5000"]   # 8085 on the host: macOS AirPlay owns :5000
    volumes: ["mlflowdata:/mlflow"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  # --- application ---------------------------------------------------------
  # The Configurator API. This is the one M3 needs: its batch-review endpoint
  # reads the tenant database, scores, reviews and writes back.
  configurator-api:
    build:
      <<: *app-build
      target: ui
    command: uvicorn services.configurator.app:app --host 0.0.0.0 --port 8000
    environment: *app-env
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      mlflow: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  dashboard:
    build:
      <<: *app-build
      target: ui
    command: >
      streamlit run services/dashboard/app.py
      --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      <<: *app-env
      MODEL_SERVER_URL: http://model-server:5001
    ports: ["${DASHBOARD_PORT:-8501}:8501"]
    depends_on:
      postgres: {condition: service_healthy}
      mlflow: {condition: service_healthy}

  # BYOC scoring server (M1/M4; M2 and M3 are batch, so neither uses this).
  # Starts with no champion registered and reports unhealthy until one is —
  # expected on a fresh stack, and why `make start` does not wait on it.
  model-server:
    build:
      <<: *app-build
      target: serve
    environment: *app-env
    ports: ["${MODEL_SERVER_PORT:-5001}:5001"]
    depends_on:
      mlflow: {condition: service_healthy}

volumes:
  pgdata:
  miniodata:
  mlflowdata:
